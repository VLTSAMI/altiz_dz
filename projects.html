<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Projects | Altiz Solutions</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        .projects-header {
            padding: 8rem 2rem 4rem;
            text-align: center;
            background: radial-gradient(circle at top, rgba(34, 197, 94, 0.1) 0%, transparent 70%);
        }

        .projects-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2.5rem;
        }

        .project-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .project-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary-accent);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .project-media {
            width: 100%;
            aspect-ratio: 16/9;
            overflow: hidden;
            background: #000;
        }

        .project-media video,
        .project-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .project-info {
            padding: 1.5rem;
        }

        .project-category {
            font-size: 0.75rem;
            color: var(--primary-accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            display: block;
        }

        .project-title {
            font-size: 1.25rem;
            margin: 0;
            font-family: 'Space Grotesk', sans-serif;
        }

        .back-btn {
            position: fixed;
            top: 2rem;
            left: 2rem;
            z-index: 100;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 0.75rem 1.25rem;
            border-radius: 50px;
            text-decoration: none;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.3s;
        }

        .back-btn:hover {
            background: var(--primary-accent);
            color: #000;
        }

        #loading-spinner {
            text-align: center;
            padding: 5rem;
            color: var(--primary-accent);
        }
    </style>
</head>

<body>
    <a href="index.html" class="back-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span data-i18n="back_home">Back to Home</span>
    </a>

    <header class="projects-header">
        <h1 class="section-title" data-i18n="nav_portfolio">Our Portfolio</h1>
        <p class="section-desc" data-i18n="portfolio_desc">A showcase of our latest digital creations and success stories.</p>
    </header>

    <div class="projects-container">
        <div id="loading-spinner">Connecting to Live Database...</div>
        <div class="projects-grid" id="projects-grid"></div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <script src="translations.js"></script>
    <script>
        // CONFIG DIRECTLY
        const firebaseConfig = {
            apiKey: "AIzaSyCNco6kLvd7CBwVutBqlXbT_1sgsqPWz9s",
            authDomain: "altiz1dz.firebaseapp.com",
            projectId: "altiz1dz",
            storageBucket: "altiz1dz.firebasestorage.app",
            messagingSenderId: "716320058728",
            appId: "1:716320058728:web:54d7fcb0dc72aba8347add"
        };

        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('projects-grid');
            const spinner = document.getElementById('loading-spinner');

            // Initialize
            firebase.initializeApp(firebaseConfig);
            const db = firebase.firestore();

            // Set Language
            const lang = localStorage.getItem('preferredLang') || 'en';
            document.documentElement.lang = lang;
            if(lang === 'ar') document.body.classList.add('rtl-layout');

            // Translate
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) el.innerHTML = translations[lang][key];
            });

            // Fetch
            db.collection("projects").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
                spinner.style.display = 'none';
                grid.innerHTML = '';
                if (snapshot.empty) {
                    grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; opacity: 0.5;">No projects found.</p>';
                    return;
                }
                snapshot.forEach((docSnap) => {
                    const p = docSnap.data();
                    const card = document.createElement('div');
                    card.className = 'project-card';
                    let mediaHtml = p.type === 'video' 
                        ? `<video src="${p.path}" autoplay muted loop playsinline poster="${p.thumbnail || ''}"></video>`
                        : `<img src="${p.path}" alt="${p.title}" loading="lazy">`;
                    
                    const projectLink = (p.link && p.link !== '#') ? p.link : p.path;
                    card.innerHTML = `
                        <div class="project-media">${mediaHtml}</div>
                        <div class="project-info">
                            <span class="project-category">${p.category}</span>
                            <h3 class="project-title">${p.title}</h3>
                            <a href="${projectLink}" target="_blank" class="portfolio-link" style="margin-top: 1rem; display: inline-flex; align-items: center; gap: 5px; color: var(--primary-accent); text-decoration: none; font-size: 0.9rem;">
                                View Full Project
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
                            </a>
                        </div>`;
                    grid.appendChild(card);
                });
            }, (error) => {
                spinner.innerHTML = "Error: " + error.message;
            });
        });
    </script>
</body>
</html>
