<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Projects | Altiz Solutions</title>
    <link rel="icon" type="image/png" href="altiz-logo-clean.png">
    <link rel="stylesheet" href="style.css?v=3.6">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        .projects-header {
            padding: 8rem 2rem 2rem;
            text-align: center;
            background: radial-gradient(circle at top, rgba(34, 197, 94, 0.1) 0%, transparent 70%);
        }

        .projects-header h1 {
            font-family: var(--font-display, 'Syne', sans-serif);
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
        }

        .filter-container {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
            padding: 0 1rem;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 0.6rem 1.5rem;
            clip-path: var(--clip-xs);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: var(--font-heading);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--primary-accent);
            color: #000;
            border-color: var(--primary-accent);
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.3);
        }

        .projects-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2.5rem;
        }

        .project-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            clip-path: var(--clip-md);
            overflow: hidden;
            transition: transform var(--transition-normal), border-color var(--transition-normal), box-shadow var(--transition-normal);
            position: relative;
        }

        .project-card:hover {
            transform: translateY(-8px);
            border-color: var(--primary-accent);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5), 0 0 20px var(--primary-glow-subtle);
        }

        .project-media {
            width: 100%;
            aspect-ratio: 16/9;
            overflow: hidden;
            background: #000;
        }

        .project-media video,
        .project-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .project-info {
            padding: 1.5rem;
        }

        .project-category {
            font-size: 0.75rem;
            color: var(--primary-accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            display: block;
        }

        .project-title {
            font-size: 1.25rem;
            margin: 0;
            font-family: var(--font-heading);
        }

        .back-btn {
            position: fixed;
            top: 2rem;
            left: 2rem;
            z-index: 100;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 0.75rem 1.25rem;
            clip-path: var(--clip-sm);
            text-decoration: none;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.3s;
        }

        .back-btn:hover {
            background: var(--primary-accent);
            color: #000;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        #loading-spinner {
            text-align: center;
            padding: 5rem;
            color: var(--primary-accent);
        }
    </style>
</head>

<body>
    <a href="index.html" class="back-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span data-i18n="back_home">Back to Home</span>
    </a>

    <header class="projects-header">
        <h1 class="section-title" data-i18n="nav_portfolio">Our Portfolio</h1>
        <p class="section-desc" data-i18n="portfolio_desc">A showcase of our latest digital creations and success stories.</p>
    </header>

    <div class="filter-container">
        <button class="filter-btn active" data-filter="all" data-i18n="filter_all">All</button>
        <button class="filter-btn" data-filter="Web Development" data-i18n="filter_web">Web Development</button>
        <button class="filter-btn" data-filter="Video Production" data-i18n="filter_video">Video Production</button>
        <button class="filter-btn" data-filter="Creative Branding" data-i18n="filter_branding">Creative Branding</button>
    </div>

    <div class="projects-container">
        <!-- Cyber Skeleton Grid shown during fetch -->
        <div id="loading-skeleton" class="skeleton-grid">
            <div class="skeleton-card cyber-clip"><div class="skeleton-media"></div><div class="skeleton-line sm"></div><div class="skeleton-line md"></div></div>
            <div class="skeleton-card cyber-clip"><div class="skeleton-media"></div><div class="skeleton-line sm"></div><div class="skeleton-line md"></div></div>
            <div class="skeleton-card cyber-clip"><div class="skeleton-media"></div><div class="skeleton-line sm"></div><div class="skeleton-line md"></div></div>
            <div class="skeleton-card cyber-clip"><div class="skeleton-media"></div><div class="skeleton-line sm"></div><div class="skeleton-line md"></div></div>
            <div class="skeleton-card cyber-clip"><div class="skeleton-media"></div><div class="skeleton-line sm"></div><div class="skeleton-line md"></div></div>
            <div class="skeleton-card cyber-clip"><div class="skeleton-media"></div><div class="skeleton-line sm"></div><div class="skeleton-line md"></div></div>
        </div>
        <div class="projects-grid" id="projects-grid"></div>
    </div>

    <!-- Firebase SDKs (Unified 9.6.10 Compat) & Utilities -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js?v=3.2"></script>
    <script src="utils.js?v=3.2"></script>
    <script src="translations.js?v=3.2"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('projects-grid');
            const skeleton = document.getElementById('loading-skeleton');
            const filterBtns = document.querySelectorAll('.filter-btn');

            let allProjects = [];

            // Unified Language & RTL logic
            const lang = localStorage.getItem('preferredLang') || 'en';
            document.documentElement.lang = lang;
            document.documentElement.dir = (lang === 'ar' ? 'rtl' : 'ltr');
            document.body.classList.toggle('rtl-layout', lang === 'ar');

            // Apply translations to all data-i18n elements
            const t_obj = translations[lang] || translations['en'];
            function applyTranslations(targetLang) {
                const t = translations[targetLang] || translations['en'];
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (t[key] !== undefined) el.innerHTML = t[key];
                });
                document.documentElement.dir = t.dir || (targetLang === 'ar' ? 'rtl' : 'ltr');
                document.body.classList.toggle('rtl-layout', targetLang === 'ar');
            }
            applyTranslations(lang);

            // Category name map using translations
            const catMap = {
                'Web Development': t_obj['filter_web'] || 'Web Development',
                'Video Production': t_obj['filter_video'] || 'Video Production',
                'Creative Branding': t_obj['filter_branding'] || 'Creative Branding',
                'Visual Identity': t_obj['filter_branding'] || 'Visual Identity',
                'Marketing': t_obj['filter_branding'] || 'Marketing'
            };

            function renderProjects(projects) {
                grid.innerHTML = '';
                if (projects.length === 0) {
                    grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; opacity: 0.5;">${escapeHtml(t_obj['portfolio_empty'] || 'No projects found.')}</p>`;
                    return;
                }
                projects.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'project-card';
                    const path = fixDriveUrl(p.path, p.type);
                    const thumb = fixDriveUrl(p.thumbnail, 'image');
                    const preview = fixDriveUrl(p.path, 'preview');
                    
                    // Use thumb if it exists, otherwise use path
                    const displayImage = thumb || path;
                    const translatedCat = catMap[p.category] || p.category;
                    const viewProjectText = t_obj['view_project'] || 'View Project';

                    const safeTitle = escapeHtml(p.title || 'Untitled');
                    const safeCat = escapeHtml(translatedCat);
                    const safeDisplayImage = escapeHtml(displayImage);
                    const safePath = escapeHtml(path);
                    const safeThumb = escapeHtml(thumb);
                    const projectLink = (p.link && p.link !== '#') ? p.link : preview;
                    const safeProjectLink = escapeHtml(projectLink);

                    let mediaHtml = '';
                    if (p.type === 'video') {
                        mediaHtml = `<video src="${safePath}" autoplay muted loop playsinline poster="${safeThumb}" 
                            style="width: 100%; height: 100%; object-fit: contain; background: #000;"></video>`;
                    } else {
                        mediaHtml = `<img src="${safeDisplayImage}" alt="${safeTitle}" loading="lazy" 
                            style="width: 100%; height: 100%; object-fit: contain; background: #000;"
                            onerror="this.src='https://via.placeholder.com/400x225/111/444?text=Image+Not+Found'">`;
                    }
                    
                    card.innerHTML = `
                        <div class="project-media">${mediaHtml}</div>
                        <div class="project-info">
                            <span class="project-category">${safeCat}</span>
                            <h3 class="project-title">${safeTitle}</h3>
                            <a href="${safeProjectLink}" target="_blank" rel="noopener noreferrer" class="portfolio-link" style="margin-top: 1rem; display: inline-flex; align-items: center; gap: 5px; color: var(--primary-accent); text-decoration: none; font-size: 0.9rem;">
                                ${escapeHtml(viewProjectText)}
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
                            </a>
                        </div>`;
                    grid.appendChild(card);
                });
            }

            // Fetch Data
            db.collection("projects").onSnapshot((snapshot) => {
                if (skeleton) skeleton.style.display = 'none';
                allProjects = [];
                snapshot.forEach(doc => allProjects.push({ id: doc.id, ...doc.data() }));
                
                // Sort by order ASC
                allProjects.sort((a, b) => (a.order || 0) - (b.order || 0));
                
                // Handle URL Filter
                const urlParams = new URLSearchParams(window.location.search);
                const filterParam = urlParams.get('filter');
                if (filterParam) {
                    const targetBtn = document.querySelector(`.filter-btn[data-filter="${filterParam}"]`);
                    if (targetBtn) {
                        filterBtns.forEach(b => b.classList.remove('active'));
                        targetBtn.classList.add('active');
                    }
                }

                const activeFilter = document.querySelector('.filter-btn.active').dataset.filter;
                if(activeFilter === 'all') {
                    renderProjects(allProjects);
                } else if(activeFilter === 'Creative Branding') {
                    // Show new branding + old visual/marketing categories
                    renderProjects(allProjects.filter(p => 
                        p.category === 'Creative Branding' || 
                        p.category === 'Visual Identity' || 
                        p.category === 'Marketing'
                    ));
                } else {
                    renderProjects(allProjects.filter(p => p.category === activeFilter));
                }
            });

            // Filter logic
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const filter = btn.dataset.filter;
                    if(filter === 'all') {
                        renderProjects(allProjects);
                    } else {
                        renderProjects(allProjects.filter(p => p.category === filter));
                    }
                });
            });
        });
    </script>
</body>

</html>
