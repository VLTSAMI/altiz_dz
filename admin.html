<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altiz Premium Admin | Control Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030303; --accent: #22c55e; --accent-glow: rgba(34, 197, 94, 0.2);
            --card: #0a0a0c; --card-hover: #121215; --text: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.5); --border: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(255, 255, 255, 0.03); --danger: #ef4444;
        }

        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; display: flex; min-height: 100vh; }
        .sidebar { width: 280px; background: var(--card); border-right: 1px solid var(--border); padding: 2.5rem 1.5rem; position: fixed; height: 100vh; box-sizing: border-box; z-index: 10; }
        .logo { font-family: 'Space Grotesk', sans-serif; font-size: 1.6rem; font-weight: 700; margin-bottom: 3rem; color: var(--accent); display: flex; align-items: center; gap: 10px; }
        .nav-link { color: var(--text-dim); text-decoration: none; padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-radius: 10px; margin-bottom: 8px; cursor: pointer; transition: 0.3s; }
        .nav-link.active { background: var(--accent-glow); color: var(--accent); }
        .main { flex: 1; padding: 4rem; margin-left: 280px; box-sizing: border-box; }
        .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 4rem; }
        h1 { font-family: 'Space Grotesk', sans-serif; font-size: 2.5rem; margin: 0; }
        .btn { background: var(--accent); color: #000; border: none; padding: 0.8rem 1.8rem; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-secondary { background: #222; color: #fff; }
        .btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
        .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2rem; }
        .project-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 1.5rem; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: var(--card); width: 90%; max-width: 800px; padding: 3rem; border-radius: 24px; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.8rem; color: var(--text-dim); }
        input, select, textarea { width: 100%; background: var(--input-bg); border: 1px solid var(--border); padding: 1rem; border-radius: 12px; color: #fff; box-sizing: border-box; }
        .plan-item { background: var(--card); border: 1px solid var(--border); border-radius: 15px; padding: 1.5rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">ALTIZ.STUDIO</div>
        <nav>
            <div class="nav-link active" onclick="showTab('projects')">Projects</div>
            <div class="nav-link" onclick="showTab('plans')">Service Plans</div>
        </nav>
    </div>

    <div class="main">
        <div id="projects-tab" class="tab-content">
            <div class="header"><h1>Projects</h1><button class="btn" onclick="openModal('project')">New Project</button></div>
            <div id="project-grid" class="project-grid">Loading...</div>
        </div>

        <div id="plans-tab" class="tab-content" style="display:none;">
            <div class="header"><h1>Service Plans</h1></div>
            <div id="plans-list">Loading...</div>
        </div>
    </div>

    <!-- Modals (Simplified) -->
    <div id="projectModal" class="modal"><div class="modal-content"><h2>Project Details</h2><form id="projectForm"><div class="form-group"><label>Title</label><input id="p-title" required></div><button type="submit" class="btn">Save</button><button type="button" class="btn btn-secondary" onclick="closeModal()">Close</button></form></div></div>

    <div id="planModal" class="modal">
        <div class="modal-content">
            <h2 id="plan-title">Edit Plan</h2>
            <form id="planForm" onsubmit="savePlan(event)">
                <input type="hidden" id="p-id">
                <div class="form-group"><label>Price (EN)</label><input id="p-price-en"></div>
                <div class="form-group"><label>Price (AR)</label><input id="p-price-ar"></div>
                <div class="form-group"><label>Feature (EN)</label><input id="p-feat-en"></div>
                <div class="form-group"><label>Feature (AR)</label><input id="p-feat-ar"></div>
                <button type="submit" class="btn">Update Cloud</button>
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="pricing_data.js"></script>

    <script>
        const config = {
            apiKey: "AIzaSyCNco6kLvd7CBwVutBqlXbT_1sgsqPWz9s",
            authDomain: "altiz1dz.firebaseapp.com",
            projectId: "altiz1dz",
            storageBucket: "altiz1dz.firebasestorage.app",
            messagingSenderId: "716320058728",
            appId: "1:716320058728:web:54d7fcb0dc72aba8347add"
        };
        firebase.initializeApp(config);
        const db = firebase.firestore();

        function showTab(t) {
            document.querySelectorAll('.tab-content').forEach(x => x.style.display = 'none');
            document.getElementById(t + '-tab').style.display = 'block';
        }

        function closeModal() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); }

        // Projects
        db.collection("projects").onSnapshot(snap => {
            const g = document.getElementById('project-grid');
            g.innerHTML = '';
            snap.forEach(doc => {
                const p = doc.data();
                g.innerHTML += `<div class="project-card"><h3>${p.title}</h3><p>${p.category}</p></div>`;
            });
        });

        // Plans
        let cloudPlans = {};
        db.collection("plans").onSnapshot(snap => {
            cloudPlans = {};
            snap.forEach(doc => cloudPlans[doc.id] = doc.data());
            renderPlans();
        });

        function renderPlans() {
            const l = document.getElementById('plans-list');
            const data = window.pricingData || {};
            l.innerHTML = '';
            Object.keys(data).forEach(id => {
                const p = { ...data[id], ...cloudPlans[id] };
                l.innerHTML += `<div class="plan-item"><div><h3>${id}</h3><p>${p.price_en || '---'}</p></div><button class="btn" onclick="editPlan('${id}')">Edit</button></div>`;
            });
        }

        function editPlan(id) {
            const data = { ...pricingData[id], ...cloudPlans[id] };
            document.getElementById('p-id').value = id;
            document.getElementById('p-price-en').value = data.price_en || '';
            document.getElementById('p-price-ar').value = data.price_ar || '';
            document.getElementById('p-feat-en').value = data.s1_name_en || '';
            document.getElementById('p-feat-ar').value = data.s1_name_ar || '';
            document.getElementById('planModal').classList.add('active');
        }

        async function savePlan(e) {
            e.preventDefault();
            const id = document.getElementById('p-id').value;
            const payload = {
                price_en: document.getElementById('p-price-en').value,
                price_ar: document.getElementById('p-price-ar').value,
                s1_name_en: document.getElementById('p-feat-en').value,
                s1_name_ar: document.getElementById('p-feat-ar').value
            };
            await db.collection("plans").doc(id).set(payload, { merge: true });
            closeModal();
        }
    </script>
</body>
</html>
