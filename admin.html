<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altiz Premium Admin | Control Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030303;
            --accent: #22c55e;
            --accent-glow: rgba(34, 197, 94, 0.2);
            --card: #0a0a0c;
            --card-hover: #121215;
            --text: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.5);
            --border: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(255, 255, 255, 0.03);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 280px;
            background: var(--card);
            border-right: 1px solid var(--border);
            padding: 2.5rem 1.5rem;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            box-sizing: border-box;
            z-index: 10;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 3rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo::before {
            content: '';
            width: 12px;
            height: 12px;
            background: var(--accent);
            border-radius: 3px;
            box-shadow: 0 0 15px var(--accent);
        }

        .nav-link {
            color: var(--text-dim);
            text-decoration: none;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .nav-link:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.03);
        }

        .nav-link.active {
            background: var(--accent-glow);
            color: var(--accent);
        }

        .status-pill {
            margin-top: auto;
            padding: 12px;
            background: rgba(34, 197, 94, 0.05);
            border: 1px solid rgba(34, 197, 94, 0.1);
            border-radius: 12px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--accent);
        }

        /* Main Content */
        .main {
            flex: 1;
            padding: 4rem;
            margin-left: 280px;
            max-width: 1200px;
            width: calc(100% - 280px);
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 4rem;
        }

        h1 { font-family: 'Space Grotesk', sans-serif; font-size: 2.5rem; margin: 0; letter-spacing: -1px; }

        .btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 0.8rem 1.8rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(34, 197, 94, 0.2);
        }

        .btn-secondary { background: #222; color: #fff; }

        /* Grid Styling */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }

        .project-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.2rem;
            transition: all 0.3s ease;
        }

        .project-card:hover {
            background: var(--card-hover);
            border-color: var(--accent);
            transform: translateY(-5px);
        }

        .media-preview {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 1.2rem;
            background: #111;
        }

        /* Modal & Form Styling */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .modal.active { display: flex; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal-content {
            background: var(--card);
            width: 100%;
            max-width: 700px;
            padding: 2.5rem;
            border-radius: 20px;
            border: 1px solid var(--border);
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }

        .form-group { margin-bottom: 1.5rem; }

        label { display: block; margin-bottom: 0.6rem; font-size: 0.85rem; font-weight: 500; color: var(--text-dim); }

        input, select, textarea {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            padding: 0.9rem;
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input:focus, select:focus { border-color: var(--accent); }

        /* FIX: Dropdown styling for readability */
        select option {
            background: #111;
            color: #fff;
            padding: 10px;
        }

        .tabs-content { display: none; animation: slideUp 0.4s ease; }
        .tabs-content.active { display: block; }
        @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .plan-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">ALTIZ.STUDIO</div>
        <nav>
            <div class="nav-link active" id="nav-projects" onclick="showTab('projects')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                Portfolio Projects
            </div>
            <div class="nav-link" id="nav-plans" onclick="showTab('plans')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
                Service Plans
            </div>
            <div class="nav-link" id="nav-sequence" onclick="showTab('sequence')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>
                Project Sequence
            </div>
            
            <div class="status-pill">
                <span style="width: 8px; height: 8px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 10px var(--accent);"></span>
                Cloud Engine Online
            </div>
        </nav>
    </div>

    <div class="main">
        <!-- Projects View -->
        <div id="projects-tab" class="tabs-content active">
            <div class="header">
                <div>
                    <p style="color: var(--accent); font-weight: 600; margin: 0;">Showcase Management</p>
                    <h1>Your Work</h1>
                </div>
                <button class="btn" onclick="openProjectModal()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    New Project
                </button>
            </div>
            <div class="project-grid" id="project-grid">Loading cloud data...</div>
        </div>

        <!-- Plans View -->
        <div id="plans-tab" class="tabs-content">
            <div class="header">
                <div>
                    <p style="color: var(--accent); font-weight: 600; margin: 0;">Pricing Engine</p>
                    <h1>Service Plans</h1>
                </div>
            </div>
            <div id="plans-list">Loading pricing data...</div>
        </div>

        <!-- Sequence View -->
        <div id="sequence-tab" class="tabs-content">
            <div class="header">
                <div>
                    <p style="color: var(--accent); font-weight: 600; margin: 0;">Sorting Center</p>
                    <h1>Project Sequence</h1>
                </div>
            </div>
            <div id="sequence-list" style="background: var(--card); border-radius: 20px; border: 1px solid var(--border); padding: 1rem;">
                <!-- Sequence list will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Project Modal -->
    <div id="projectModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle" style="margin-top: 0; font-family: 'Space Grotesk'; font-size: 1.8rem;">Project Details</h2>
            <form id="projectForm" onsubmit="handleProjectSave(event)">
                <input type="hidden" id="projectId">
                <div class="form-grid">
                    <div class="form-group"><label>Project Title</label><input type="text" id="title" placeholder="e.g. Modern Brand Identity" required></div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="category">
                            <option value="Web Development">Web Development</option>
                            <option value="Video Production">Video Production</option>
                            <option value="Creative Branding">Creative Branding</option>
                        </select>
                    </div>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Media Content Type</label>
                        <select id="type"><option value="image">Still Image</option><option value="video">Motion Video</option></select>
                    </div>
                    <div class="form-group"><label>Direct URL / Drive Link</label><input type="text" id="path" placeholder="https://..." required></div>
                </div>
                <div class="form-group">
                    <label>Thumbnail / Poster URL (Highly recommended for videos)</label>
                    <input type="text" id="thumbnail" placeholder="https://...">
                </div>
                <div class="form-group"><label>External Link (Optional)</label><input type="url" id="link" placeholder="https://behance.net/..."></div>
                <div style="display: flex; gap: 1rem; margin-top: 1rem; justify-content: flex-end;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Dismiss</button>
                    <button type="submit" class="btn" id="projectSaveBtn">Deploy Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Plan Modal (Multi-Language Support) -->
    <div id="planModal" class="modal">
        <div class="modal-content">
            <h2 style="margin-top: 0; font-family: 'Space Grotesk'; font-size: 1.8rem;">Edit Plan</h2>
            <form id="planForm" onsubmit="handlePlanSave(event)">
                <input type="hidden" id="planId">
                
                <div style="border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 1.5rem;">
                    <label style="color: var(--accent); font-weight: bold;">PRICE</label>
                    <div class="form-grid">
                        <div class="form-group"><label>Price (English)</label><input type="text" id="price_en" placeholder="8,000 DZD"></div>
                        <div class="form-group"><label>Price (العربية)</label><input type="text" id="price_ar" placeholder="8,000 دج" dir="rtl"></div>
                    </div>
                </div>

                <div style="margin-bottom: 1rem;">
                    <label style="color: var(--accent); font-weight: bold;">FEATURES (English)</label>
                    <div class="form-grid">
                        <div class="form-group"><label>Feature 1</label><input type="text" id="s1_name_en"></div>
                        <div class="form-group"><label>Feature 2</label><input type="text" id="s2_name_en"></div>
                    </div>
                </div>

                <div style="margin-bottom: 1rem;">
                    <label style="color: var(--accent); font-weight: bold;">المميزات (العربية)</label>
                    <div class="form-grid" dir="rtl">
                        <div class="form-group"><label>الميزة 1</label><input type="text" id="s1_name_ar"></div>
                        <div class="form-group"><label>الميزة 2</label><input type="text" id="s2_name_ar"></div>
                    </div>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 1rem; justify-content: flex-end;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn" id="planSaveBtn">Sync Cloud</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCNco6kLvd7CBwVutBqlXbT_1sgsqPWz9s",
            authDomain: "altiz1dz.firebaseapp.com",
            projectId: "altiz1dz",
            storageBucket: "altiz1dz.firebasestorage.app",
            messagingSenderId: "716320058728",
            appId: "1:716320058728:web:54d7fcb0dc72aba8347add"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function fixDriveUrl(url, type = 'image') {
            if (!url) return "";
            if (url.includes("drive.google.com")) {
                const id = url.split("/d/")[1]?.split("/")[0] || url.split("id=")[1]?.split("&")[0];
                if (!id) return url;
                
                if (type === 'video') return `https://docs.google.com/uc?export=download&id=${id}`;
                if (type === 'preview') return `https://drive.google.com/file/d/${id}/view`;
                
                // Use official Google Drive thumbnail endpoint for images and posters
                return `https://drive.google.com/thumbnail?id=${id}&sz=w1000`;
            }
            return url;
        }

        function showTab(tab) {
            document.querySelectorAll('.tabs-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            document.getElementById(tab + '-tab').classList.add('active');
            document.getElementById('nav-' + tab).classList.add('active');
        }

        // Projects logic
        db.collection("projects").onSnapshot(snap => {
            const grid = document.getElementById('project-grid');
            grid.innerHTML = '';
            
            // Convert to array and sort manually in JS to avoid disappearing projects without 'order' field
            const projects = [];
            snap.forEach(doc => projects.push({ id: doc.id, ...doc.data() }));
            
            projects.sort((a, b) => (a.order || 0) - (b.order || 0));

            projects.forEach(p => {
                const id = p.id;
                const path = fixDriveUrl(p.path, p.type);
                const thumb = fixDriveUrl(p.thumbnail, 'image');
                const card = document.createElement('div');
                card.className = 'project-card';
                card.innerHTML = `
                    ${p.type === 'video' ? `<video class="media-preview" src="${path}" muted poster="${thumb}"></video>` : `<img class="media-preview" src="${path}">`}
                    <h3 style="margin: 0 0 5px 0; font-size: 1.1rem;">${p.title}</h3>
                    <p style="color: var(--accent); font-size: 0.8rem; text-transform: uppercase; margin-bottom: 0.5rem;">${p.category}</p>
                    <p style="font-size: 0.7rem; opacity: 0.5; margin-bottom: 1.2rem;">Priority Order: ${p.order || 0}</p>
                    <div style="display:flex; gap:10px;">
                        <button class="btn btn-secondary" onclick="editProject('${id}')" style="flex:1; padding: 0.5rem;">Edit</button>
                        <button class="btn btn-secondary" onclick="deleteProject('${id}')" style="flex:0.5; padding: 0.5rem; color: #ff4444;">×</button>
                    </div>`;
                grid.appendChild(card);
            });

            // Update Sequence List
            const seqList = document.getElementById('sequence-list');
            seqList.innerHTML = '';
            projects.forEach((p, index) => {
                const item = document.createElement('div');
                item.className = 'sequence-item';
                item.draggable = true;
                item.dataset.id = p.id;
                item.style = "display: flex; align-items: center; justify-content: space-between; padding: 1rem; border-bottom: 1px solid var(--border); cursor: grab; background: var(--card); transition: background 0.2s;";
                item.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 1rem; pointer-events: none;">
                        <span style="color: var(--accent); font-weight: bold; width: 30px;">#${index + 1}</span>
                        <img src="${fixDriveUrl(p.thumbnail || p.path, 'image')}" style="width: 50px; height: 35px; object-fit: cover; border-radius: 4px;">
                        <span>${p.title}</span>
                    </div>
                    <div style="color: var(--text-dim); pointer-events: none;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h16M4 16h16"></path></svg>
                    </div>
                `;
                
                // Drag and Drop Events
                item.addEventListener('dragstart', (e) => {
                    e.target.classList.add('dragging');
                    e.dataTransfer.setData('text/plain', p.id);
                });
                item.addEventListener('dragend', (e) => e.target.classList.remove('dragging'));
                
                seqList.appendChild(item);
            });

            seqList.addEventListener('dragover', (e) => {
                e.preventDefault();
                const draggingItem = document.querySelector('.dragging');
                const afterElement = getDragAfterElement(seqList, e.clientY);
                if (afterElement == null) {
                    seqList.appendChild(draggingItem);
                } else {
                    seqList.insertBefore(draggingItem, afterElement);
                }
            });

            seqList.addEventListener('drop', async (e) => {
                e.preventDefault();
                const items = [...seqList.querySelectorAll('.sequence-item')];
                const batch = db.batch();
                items.forEach((item, index) => {
                    const ref = db.collection("projects").doc(item.dataset.id);
                    batch.update(ref, { order: index + 1 });
                });
                await batch.commit();
            });
        });

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('.sequence-item:not(.dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        async function updateProjectOrder(id, newOrder) {
            await db.collection("projects").doc(id).update({
                order: parseInt(newOrder) || 1,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        async function handleProjectSave(e) {
            e.preventDefault();
            const id = document.getElementById('projectId').value;
            const data = {
                title: document.getElementById('title').value,
                category: document.getElementById('category').value,
                type: document.getElementById('type').value,
                path: document.getElementById('path').value,
                thumbnail: document.getElementById('thumbnail').value,
                link: document.getElementById('link').value,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            if (id) await db.collection("projects").doc(id).update(data);
            else {
                // Auto-increment order
                const snap = await db.collection("projects").get();
                let maxOrder = 0;
                snap.forEach(doc => {
                    const p = doc.data();
                    if (p.order > maxOrder) maxOrder = p.order;
                });
                data.order = maxOrder + 1;
                data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                await db.collection("projects").add(data);
            }
            closeModal();
        }

        async function editProject(id) {
            const doc = await db.collection("projects").doc(id).get();
            const p = doc.data();
            document.getElementById('projectId').value = id;
            document.getElementById('title').value = p.title;
            document.getElementById('category').value = p.category;
            document.getElementById('type').value = p.type;
            document.getElementById('path').value = p.path;
            document.getElementById('thumbnail').value = p.thumbnail || '';
            document.getElementById('link').value = p.link || '';
            document.getElementById('modalTitle').textContent = 'Update Project';
            document.getElementById('projectModal').classList.add('active');
        }

        function openProjectModal() {
            document.getElementById('projectForm').reset();
            document.getElementById('projectId').value = '';
            document.getElementById('modalTitle').textContent = 'New Project';
            document.getElementById('projectModal').classList.add('active');
        }

        async function deleteProject(id) {
            if (confirm("Permanently delete this project from cloud?")) {
                await db.collection("projects").doc(id).delete();
                
                // Re-index remaining projects to ensure no gaps or duplicates
                const snap = await db.collection("projects").orderBy("order", "asc").get();
                const batch = db.batch();
                let i = 1;
                snap.forEach(doc => {
                    batch.update(doc.ref, { order: i++ });
                });
                await batch.commit();
            }
        }

        // Plans logic
        db.collection("plans").onSnapshot(snap => {
            const list = document.getElementById('plans-list');
            list.innerHTML = '';
            snap.forEach(doc => {
                const p = doc.data();
                const card = document.createElement('div');
                card.className = 'plan-item';
                card.innerHTML = `
                    <div>
                        <h3 style="margin:0; font-family: 'Space Grotesk';">${doc.id.replace(/_/g, ' ').toUpperCase()}</h3>
                        <p style="color:var(--accent); margin:8px 0; font-weight: 600;">${p.price_en || 'Free'}</p>
                    </div>
                    <button class="btn" style="background:#222; color:#fff" onclick="editPlan('${doc.id}')">Configure Plan</button>
                `;
                list.appendChild(card);
            });
        });

        async function editPlan(id) {
            const doc = await db.collection("plans").doc(id).get();
            const p = doc.data();
            document.getElementById('planId').value = id;
            document.getElementById('price_en').value = p.price_en || '';
            document.getElementById('price_ar').value = p.price_ar || '';
            document.getElementById('s1_name_en').value = p.s1_name_en || '';
            document.getElementById('s2_name_en').value = p.s2_name_en || '';
            document.getElementById('s1_name_ar').value = p.s1_name_ar || '';
            document.getElementById('s2_name_ar').value = p.s2_name_ar || '';
            document.getElementById('planModal').classList.add('active');
        }

        async function handlePlanSave(e) {
            e.preventDefault();
            const id = document.getElementById('planId').value;
            const data = {
                price_en: document.getElementById('price_en').value,
                price_ar: document.getElementById('price_ar').value,
                s1_name_en: document.getElementById('s1_name_en').value,
                s2_name_en: document.getElementById('s2_name_en').value,
                s1_name_ar: document.getElementById('s1_name_ar').value,
                s2_name_ar: document.getElementById('s2_name_ar').value,
            };
            await db.collection("plans").doc(id).update(data);
            closeModal();
        }

        function closeModal() {
            document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
        }
    </script>
</body>
</html>
