<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altiz Dashboard | Fast Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --accent: #22c55e;
            --card: #0a0a0c;
            --text: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.6);
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 260px;
            background: var(--card);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            padding: 2rem;
            display: flex;
            flex-direction: column;
        }
        .main {
            flex: 1;
            padding: 3rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }
        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 3rem;
            color: var(--accent);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
        }
        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            margin: 0;
        }
        .btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .btn-outline {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:hover, .btn-outline:hover {
            transform: scale(1.05);
        }
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }
        .project-card {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1.5rem;
            position: relative;
        }
        .project-card img, .project-card video {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: var(--card);
            width: 100%;
            max-width: 600px;
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-height: 90vh;
            overflow-y: auto;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-dim);
        }
        input, select, textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.75rem;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            outline: none;
            font-family: monospace;
        }
        .nav-item {
            padding: 0.75rem 1rem;
            margin: 0.25rem 0;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-dim);
            transition: all 0.2s;
        }
        .nav-item.active {
            background: rgba(34, 197, 94, 0.1);
            color: var(--accent);
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">ALTIZ.ADMIN</div>
        <nav>
            <p style="color: var(--accent); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;">Management</p>
            <div class="nav-item active">Portfolio Editor</div>
        </nav>
    </div>

    <div class="main">
        <div class="header">
            <div>
                <h1>Portfolio Data Manager</h1>
                <p style="color: var(--text-dim); margin-top: 5px;">Any Add/Edit/Delete action will automatically download the updated data file.</p>
            </div>
            <div>
                <button class="btn" onclick="openProjectModal()">+ Add New Project</button>
            </div>
        </div>

        <div class="project-grid" id="admin-project-grid">
            <!-- Existing projects will appear here -->
        </div>
    </div>

    <!-- Add/Edit Project Modal -->
    <div id="projectModal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title" style="margin-top: 0;">Add New Project</h2>
            <form id="projectForm" onsubmit="saveProject(event)">
                <div class="form-group">
                    <label>Project Title</label>
                    <input type="text" id="title" required placeholder="e.g. Cinematic Commercial">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="category" required>
                        <option value="Web Development">Web Development</option>
                        <option value="Video Production">Video Production</option>
                        <option value="Visual Identity">Visual Identity</option>
                        <option value="Marketing">Marketing</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Media Type</label>
                    <select id="type" required>
                        <option value="image">Image</option>
                        <option value="video">Video</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Main Media Path (Image/Video File)</label>
                    <input type="text" id="path" required placeholder="portfolio_assets/video_3D/video.mp4">
                    <small style="color: var(--text-dim); font-size: 0.75rem;">Path to the file inside portfolio_assets folder.</small>
                </div>
                <div class="form-group">
                    <label>Thumbnail Path (Optional - Recommended for Videos)</label>
                    <input type="text" id="thumbnail" placeholder="portfolio_assets/video_3D/thumb.jpg">
                    <small style="color: var(--accent); font-size: 0.75rem;">This image will appear before the video plays.</small>
                </div>
                <div class="form-group">
                    <label>External Link (Optional)</label>
                    <input type="url" id="link" placeholder="https://vimeo.com/...">
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="button" class="btn" style="background: rgba(255,255,255,0.1); color: #fff;" onclick="closeModal('projectModal')">Cancel</button>
                    <button type="submit" class="btn" style="flex: 1;">Save Project</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Load existing data to memory -->
    <script src="portfolio_data.js"></script>

    <script>
        // Use the loaded 'projects' array from portfolio_data.js
        let currentProjects = typeof projects !== 'undefined' ? [...projects] : [];
        let editingIndex = -1; // -1 means adding new, otherwise it's the index being edited

        function renderProjects() {
            const grid = document.getElementById('admin-project-grid');
            grid.innerHTML = '';
            
            // Show newest first visually
            [...currentProjects].reverse().forEach((p, revIndex) => {
                const actualIndex = currentProjects.length - 1 - revIndex;
                const card = document.createElement('div');
                card.className = 'project-card';
                
                let mediaHtml = '';
                if (p.type === 'video') {
                    let poster = p.thumbnail ? `poster="${p.thumbnail}"` : '';
                    mediaHtml = `<video src="${p.path}" muted loop ${poster}></video>`;
                } else {
                    mediaHtml = `<img src="${p.path}" alt="${p.title}" onerror="this.src='https://via.placeholder.com/300x150/111/444?text=Missing+File'">`;
                }

                card.innerHTML = `
                    ${mediaHtml}
                    <span style="font-size: 0.6rem; color: #888; background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 4px; float: right;">${p.type.toUpperCase()}</span>
                    <h3 style="margin-top: 0;">${p.title}</h3>
                    <p style="color: var(--accent); font-size: 0.8rem; margin: 0 0 1rem 0;">${p.category}</p>
                    ${p.thumbnail ? `<p style="font-size: 0.75rem; color: var(--text-dim);">+ Has Thumbnail</p>` : ''}
                    <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
                        <button onclick="editProject(${actualIndex})" style="flex: 1; background: rgba(255,255,255,0.1); color: #fff; border: none; padding: 8px; border-radius: 4px; cursor: pointer;">Edit</button>
                        <button onclick="removeProject(${actualIndex})" style="flex: 1; background: rgba(255,50,50,0.1); color: #ff3232; border: 1px solid rgba(255,50,50,0.3); padding: 8px; border-radius: 4px; cursor: pointer;">Remove</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function editProject(index) {
            editingIndex = index;
            const p = currentProjects[index];
            
            document.getElementById('title').value = p.title || '';
            document.getElementById('category').value = p.category || 'Web Development';
            document.getElementById('type').value = p.type || 'image';
            document.getElementById('path').value = p.path || '';
            document.getElementById('thumbnail').value = p.thumbnail || '';
            document.getElementById('link').value = p.link || '';

            document.getElementById('modal-title').textContent = 'Edit Project';
            document.getElementById('projectModal').classList.add('active');
        }

        function removeProject(actualIndex) {
            if(confirm("Are you sure you want to remove this project?")) {
                currentProjects.splice(actualIndex, 1);
                renderProjects();
                triggerDownload();
            }
        }

        function openProjectModal() {
            editingIndex = -1; // Reset to Add mode
            document.getElementById('projectForm').reset();
            document.getElementById('modal-title').textContent = 'Add New Project';
            document.getElementById('projectModal').classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function saveProject(e) {
            e.preventDefault();
            const newProject = {
                title: document.getElementById('title').value.trim(),
                category: document.getElementById('category').value,
                path: document.getElementById('path').value.trim(),
                type: document.getElementById('type').value
            };

            const thumb = document.getElementById('thumbnail').value.trim();
            if (thumb) newProject.thumbnail = thumb;

            const link = document.getElementById('link').value.trim();
            if (link) newProject.link = link;

            if (editingIndex >= 0) {
                // Edit existing
                currentProjects[editingIndex] = newProject;
            } else {
                // Add new
                currentProjects.push(newProject);
            }

            renderProjects();
            closeModal('projectModal');
            triggerDownload();
        }

        function triggerDownload() {
            // Generate the JavaScript content
            const jsonString = JSON.stringify(currentProjects, null, 4);
            const content = \`const projects = \${jsonString};\n\`;
            
            // Create a Blob and trigger download
            const blob = new Blob([content], { type: 'text/javascript' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'portfolio_data.js';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            alert("تم التحديث! تمت عملية التحميل التلقائي لملف portfolio_data.js. \n\nالخطوة الأخيرة: قم بنقل الملف المحمل ووافق على استبداله بالملف القديم في مجلد موقعك، ثم ارفع التغييرات إلى Github.");
        }

        // Initial render
        renderProjects();
    </script>
</body>
</html>
